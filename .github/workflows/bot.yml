name: Pip GTA6 bot

on:
  schedule:
    - cron: "17,47 * * * *"  # cada 30 minutos
  workflow_dispatch: {}      # botón para lanzarlo a mano
  push:
    paths: ["trigger.txt"]  # tocar este archivo lo lanza al momento

permissions:
  contents: write

concurrency:
  group: pipbot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        timeout-minutes: 10
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg)
          pip install -q -r requirements.txt
          if [ -n "$ANTHROPIC_API_KEY" ]; then pip install -q faster-whisper; fi
      - name: Buscar, montar y programar clips
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-haiku-5-5' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRAFT_MODE: ${{ vars.DRAFT_MODE || 'false' }}
          CLIPS_PER_RUN: ${{ vars.CLIPS_PER_RUN || '4' }}
          MAX_PER_DAY: ${{ vars.MAX_PER_DAY || '48' }}
          TARGET_SERVICES: ${{ vars.TARGET_SERVICES || 'youtube,tiktok,instagram' }}
        shell: bash
        run: |
          set -o pipefail
          python bot.py 2>&1 | tee run.log
      - name: Guardar estado
        if: always()
        run: |
          git config user.name pipbot
          git config user.email pipbot@users.noreply.github.com
          git add state.json run.log || true
          git diff --cached --quiet || (git commit -q -m "estado" && git pull -q --rebase && git push -q)
